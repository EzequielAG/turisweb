<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Turisweb Hidalgo</title>
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css"/>
    <link rel="stylesheet" href="css/login.css"/>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">turisweb</div>
                <div class="login-title">Bienvenido de Nuevo</div>
                <div class="login-subtitle">Ingresa para descubrir tu próximo destino.</div>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        placeholder="Ingresa tu usuario"
                        requireds
                        autocomplete="username"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Ingresa tu contraseña"
                        required
                        autocomplete="current-password"
                    />
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <span>Iniciar Sesión</span>
                </button>
            </form>

            <div class="help-link">
                <a href="javascript:void(0)" onclick="showHelpAlert()">¿Necesitas ayuda?</a>
            </div>

            <div class="register-link">
                <p>¿Primera vez aquí? <a href="register.html">Regístrate ahora.</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
