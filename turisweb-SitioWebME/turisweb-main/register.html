<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Turisweb Hidalgo</title>
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
    <link rel="stylesheet" href="css/register.css"/>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="register-logo">turisweb</div>
                <div class="register-title">Únete a Turisweb</div>
                <div class="register-subtitle">Crea una cuenta para comenzar tu viaje.</div>
            </div>

            <div id="alertContainer"></div>

            <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre completo"
                        required
                        autocomplete="name"
                    />
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Ingresa tu correo electrónico"
                        required
                        autocomplete="email"
                    />
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Crea una contraseña"
                        required
                        autocomplete="new-password"
                        oninput="checkPasswordRequirements()"
                    />
                    <div class="password-requirements">
                        <div class="requirement invalid" id="req-length">
                            <div class="requirement-icon">✓</div>
                            Al menos 6 caracteres
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirma tu contraseña"
                        required
                        autocomplete="new-password"
                    />
                </div>

                <button type="submit" class="btn-register" id="registerBtn">
                    <span>Crear Cuenta</span>
                </button>
            </form>

            <div class="login-link">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
